name: nuclear_data_to_arrow CI

# Path-filtered on purpose: this package is pure Python and shares no build with
# the Rust wheels, so it must not add latency to Rust or yamc-Python PRs.
on:
  push:
    branches: [main]
    paths:
      - "packages/nuclear_data_to_arrow/**"
      - ".github/workflows/ci-nuclear-data-to-arrow.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/nuclear_data_to_arrow/**"
      - ".github/workflows/ci-nuclear-data-to-arrow.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The endf-free half first, and on its own, because it is the half that
      # has to keep working without the fork (issue #525). The readers, the
      # schemas and the manifest parse no ENDF, and eager writer imports used to
      # drag `endf.incident_photon` in behind them: on #524 that stopped pytest
      # COLLECTING a test that touches nothing but manifest.json and pyarrow.
      - name: Install package (no endf)
        run: pip install -e "packages/nuclear_data_to_arrow[dev]"

      - name: The endf-free half imports and tests without the fork
        run: |
          python -c "
          import nuclear_data_to_arrow as n
          n.read_neutron_from_arrow, n.read_photon_from_arrow
          from nuclear_data_to_arrow import schemas
          print('endf-free surface OK', n.__version__)
          "
          pytest packages/nuclear_data_to_arrow/tests/test_schema_manifest.py \
                 packages/nuclear_data_to_arrow/tests/test_completion.py -q

      # endf is installed from the fork rather than PyPI: from_njoy, Chain,
      # radionuclide_production, isomer_table / level_to_isomeric_state,
      # univariate and the Compton profile helpers are fork-only. The ACE reader
      # is not, despite what this comment used to say: endf 0.1.12 on PyPI ships
      # ace.py and IncidentNeutron.from_ace. incident_photon is the module whose
      # absence breaks a PyPI install, and it breaks it at import.
      # The branch is load-bearing: that work lives on local-develop, and the
      # fork's `main` tracks upstream and has none of it.
      #
      # Installed here rather than declared in pyproject.toml, because a
      # dependency list cannot name a git branch in a way a published wheel can
      # honour, and naming bare `endf` named the wrong package.
      - name: Install endf (fork), for the writers
        run: |
          pip install "endf @ git+https://github.com/shimwell/endf-python@local-develop"

      # No NJOY and no openmc: the suite vendors an Li6 ACE table and an Fe
      # photoatomic/relaxation ENDF pair and is hermetic without them.
      - name: Test
        run: pytest packages/nuclear_data_to_arrow/tests -q

      # The package is a library: every entry point lives in
      # nuclear_data_generation_scripts. Touching a writer is the sharpest smoke
      # test, since a wrong `endf` fails right there. It has to be a writer
      # rather than a bare import now that the writer imports are lazy: an
      # import alone no longer reaches endf at all, which is the point of the
      # laziness and would make this step prove nothing.
      - name: Imports, and installs no console scripts
        run: |
          python -c "
          import nuclear_data_to_arrow as n
          print('imported', n.__version__)
          assert n.convert_neutron and n.convert_photon
          assert n.convert_transmutation and n.convert_branching
          assert n.export_neutron_to_arrow and n.export_photon_to_arrow
          assert n.export_transmutation_to_arrow and n.verify_neutron
          "
          if compgen -G "$(python -c 'import sysconfig;print(sysconfig.get_path(\"scripts\"))')/*-to-arrow" > /dev/null; then
            echo "FAILED: console scripts were reintroduced"; exit 1
          fi

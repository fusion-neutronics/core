name: Main health

# Nobody watches main after a merge, and a run that fails there shows up
# nowhere a person looks: the PR is closed, and GitHub's own notice is an
# email to whoever merged. So a failure on main opens an issue, labelled
# `main-red`, one per workflow. A later failure of the same workflow comments
# on that issue rather than opening another, and the first success closes it.
#
# Some checks run only on main (macos-14 Rust tests, the full Python matrix,
# coverage), so this is what makes a failure there reach someone.
#
# `workflow_run` always runs the copy of this file on the default branch, so it
# takes effect once merged.

on:
  workflow_run:
    workflows: [Rust tests, Python CI, WASM tests, Documentation, Licenses]
    types: [completed]
    branches: [main]

permissions:
  issues: write
  actions: read

# One update per workflow at a time, in order, so two quick merges cannot open
# two issues for the same workflow.
concurrency:
  group: main-health-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  report:
    name: Report ${{ github.event.workflow_run.name }} on main
    # Pushes to main only: a pull request whose branch is called main (from a
    # fork) is not main. Cancelled and skipped runs say nothing either way.
    if: >-
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Open, update or close the workflow's issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_TITLE: ${{ github.event.workflow_run.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          title="main is failing: $WORKFLOW"
          commit="${SHA:0:7} ($(head -1 <<<"$COMMIT_TITLE"))"
          number="$(gh issue list --state open --label main-red --limit 100 \
                      --json number,title \
                      --jq ".[] | select(.title == \"$title\") | .number" | head -1)"

          if [ "$CONCLUSION" = success ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Green again at $commit: $RUN_URL"
              gh issue close "$number"
            fi
            exit 0
          fi

          failed="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
                      --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"')"
          body="$(printf '%s failed on main at %s.\n\nRun: %s\n\nFailed jobs:\n%s\n' \
                    "$WORKFLOW" "$commit" "$RUN_URL" "${failed:-"- (none reported)"}")"

          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create main-red --color B60205 \
              --description "A workflow is failing on main" 2>/dev/null || true
            gh issue create --title "$title" --label main-red --body "$body

          This issue closes itself when $WORKFLOW next passes on main."
          fi

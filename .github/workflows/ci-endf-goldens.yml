name: endf goldens

# The Rust side of `crates/endf` needs nothing extra: `ci-rust.yml` already runs
# `cargo test --workspace` and `cargo clippy --workspace`, and the crate's
# fixtures live in the repository, so its 132 unit tests and the golden
# comparison run there with no Python at all.
#
# This workflow guards the other direction: that the goldens can still be
# REGENERATED. They are what the Rust reader is held to, and they are produced
# by the Python reader in shimwell/endf-python. A golden that can be verified
# but not regenerated is a snapshot of itself, so this job re-derives every one
# and fails if any drifts.
#
# Path-filtered: it installs a Python reader over the network and has nothing to
# say about a change elsewhere in the repository.
on:
  push:
    branches: [main]
    paths:
      - "crates/endf/**"
      - "tools/**"
      - ".github/workflows/ci-endf-goldens.yml"
  # Every pull request, whatever its base, so a PR stacked on another
  # PR's branch is tested before it is retargeted at main.
  pull_request:
    paths:
      - "crates/endf/**"
      - "tools/**"
      - ".github/workflows/ci-endf-goldens.yml"
  workflow_dispatch:

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The fork is load-bearing twice over. The reader has to be the fork
      # (upstream has no Chain, no from_njoy, no radionuclide_production), and
      # it has to be the revision that teaches it to read `.xz`, because every
      # fixture here is stored compressed. The fork's main development line has
      # the first and not the second, so it cannot regenerate these.
      #
      # Pinned to a commit, not to the branch that carries it. A mutable ref
      # means the oracle can be redefined without a commit here: a new push to
      # that branch silently changes what every golden is compared against,
      # and deleting the branch (which is the convention once it merges) turns
      # this job red on an unrelated PR that only touched crates/endf. The Rust
      # side already pins its git dependencies by revision in Cargo.lock, so
      # this is the same rule applied to the one Python dependency.
      #
      # The pinned commit is the endf-python reader with its fixes for the
      # MF=33 LB=0 to 4 table split and for the padding of LRF=7 resonances to
      # six-value lines, the reader the MF33 and MF32 fixtures' goldens were
      # written with. That work is not on the fork's main development line
      # yet; repoint there once it is. Bumping it is a deliberate act: a fix to
      # the fork's reader does not reach these goldens until someone changes
      # this line, which is the trade a reproducible oracle asks for.
      - name: Install the endf reader the goldens are generated from
        run: |
          pip install "endf @ git+https://github.com/shimwell/endf-python@9ae252028d334c55adcd32a7015e019453c64f9d"

      # Regenerates every single-file golden from the fixtures and diffs them
      # against what is committed. The chain golden is built by a second tool
      # (it spans ten decay and two neutron evaluations) and is checked next.
      - name: Goldens are current
        run: python tools/dump_golden.py --check

      - name: Chain golden is current
        run: python tools/dump_chain_golden.py --check

# Builds yamc-core and yani-core as Pyodide (Emscripten) wheels and runs each
# inside Pyodide.
#
# yamc-online and yani-online (the browser pages that run yamc and yani Python
# on Pyodide) install these wheels from PyPI. yamc-online used to vendor one
# built by hand from a local branch, so nothing here noticed when a change
# stopped the emscripten build compiling, and the page could not say which
# commit its wheel came from.
#
# Published to PyPI with the native wheels. PyPI's trusted publishers are bound
# to ci-python.yml, so the upload has to come from a job in that file: on a
# release (or a dispatch that publishes) ci-python.yml calls this workflow for
# the projects it publishes, and its `collect` job picks each artifact up by the
# `wheels-*` name like any other wheel of that project. Pushes and pull
# requests run this file on its own, for both projects, to keep the builds and
# the smoke tests honest.
name: Pyodide wheel

on:
  push:
    branches: [ main ]
  # Every pull request, whatever its base, so a PR stacked on another
  # PR's branch is tested before it is retargeted at main.
  pull_request:
    # A change to prose alone cannot break a build or a test: no test, script or
    # include_str! reads a Markdown file. Pushes to main and releases are not
    # filtered.
    paths-ignore: ['**/*.md', 'docs/**', 'mkdocs.yml', 'LICENSE*']
  workflow_dispatch:
  # ci-python.yml, on a run that publishes. Not a `release` trigger here as
  # well, which would build the same wheels twice.
  workflow_call:
    inputs:
      projects:
        # Only what the run publishes: `collect` refuses a wheel of a project
        # the run does not publish, so a yani-core-only release must not build
        # yamc-core's.
        description: 'The projects to build, as a JSON list: ["yamc-core"], ["yani-core"] or both'
        type: string
        required: true
      yamc_version:
        description: "Override yamc-core's version, as ci-python.yml's dispatch input of that name"
        type: string
        required: false
        default: ""
      yani_version:
        description: "Override yani-core's version, as ci-python.yml's dispatch input of that name"
        type: string
        required: false
        default: ""

# A newer push to a pull request makes its older run moot, so that run is
# cancelled. Only pull-request runs: a push to main and a manual dispatch always
# finish, as does a call from ci-python.yml, so nothing that builds or publishes
# is cut short. Anything but a pull request groups by run id, so it never
# queues behind (or is replaced by) another run. The group names this file
# rather than reading `github.workflow`, which in a called workflow is the
# caller's name: it would land in ci-python.yml's own group and wait on the run
# that is waiting on it.
concurrency:
  group: pyodide-wheel-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Three tries over ten seconds is all cargo gives a registry that is briefly
  # unreachable, and a release has already been lost to a twelve-second one
  # (yani-core 0.11.0). Ten stretches the same ladder over about a minute.
  CARGO_NET_RETRY: 10
  # The Pyodide release the wheels are built against. MUST match
  # vendor/PYODIDE_VERSION in yamc-online and yani-online: the wheel's platform
  # tag and ABI are Pyodide's, and each page loads that exact Pyodide from the
  # CDN. Bump them together. The Python below has to match this release's
  # Python (3.14 for 314.x).
  PYODIDE_VERSION: 314.0.7
  # pyodide-build drives the cross build. Pinned because each release supports
  # a range of xbuildenv versions (`pyodide xbuildenv search` lists them), and
  # an unpinned upgrade could drop the one above.
  PYODIDE_BUILD_VERSION: 0.39.1

jobs:
  pyodide_wheel:
    name: Build and test the ${{ matrix.project }} Pyodide wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One project's failure says nothing about the other's wheel.
      fail-fast: false
      matrix:
        # Both on a push or a pull request, where there are no inputs.
        project: ${{ fromJSON(inputs.projects || '["yamc-core", "yani-core"]') }}
    env:
      PROJECT: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v7

      # Only a ci-python.yml dispatch that names one, so the Pyodide wheel goes
      # out at the same number as the native wheels of that run.
      - name: Override yamc-core's version
        if: matrix.project == 'yamc-core' && inputs.yamc_version != ''
        env:
          VERSION: ${{ inputs.yamc_version }}
        run: bash scripts/set-wheel-version.sh yamc-python "$VERSION"
      - name: Override yani-core's version
        if: matrix.project == 'yani-core' && inputs.yani_version != ''
        env:
          VERSION: ${{ inputs.yani_version }}
        run: bash scripts/set-wheel-version.sh yani-python "$VERSION"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # dtolnay, as in the wheel jobs of ci-python.yml: it sets no RUSTFLAGS,
      # which would replace the remaps in `.cargo/config.toml`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # Its own key: wasm32-unknown-emscripten shares no compiled artifacts
      # with any other job. One per project, since the two builds differ in
      # features and would otherwise race to save the same key.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pyodide-${{ matrix.project }}
          cache-on-failure: true

      - name: Install pyodide-build and the cross-build environment
        run: |
          set -euo pipefail
          pip install "pyodide-build==${PYODIDE_BUILD_VERSION}"
          pyodide xbuildenv install "$PYODIDE_VERSION"
          # The Emscripten SDK this Pyodide was built with, patched as Pyodide
          # patches it. Its version comes from the xbuildenv.
          pyodide xbuildenv install-emscripten
          echo "Emscripten $(pyodide config get emscripten_version)"

      # Same bundle the native wheels ship, generated the same way.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0
      - name: Generate THIRD-PARTY-LICENSES.html for the wheel
        run: cargo about generate about.hbs --all-features --locked -o "packages/$PROJECT/THIRD-PARTY-LICENSES.html"

      # `--no-default-features` drops download-tls, and for yamc-core mesh,
      # cad and gpu as well. Pyodide has no sockets, so downloads go through
      # the fetcher the host installs with `_core._set_data_fetcher` (one hook,
      # registered by yani-python for both wheels; in the pages, a helper
      # worker's concurrent fetch() calls, which the Python worker blocks on
      # with Atomics.wait). The wasm viewer blobs the native yamc-core wheels
      # ship under yamc/_wasm/ are not added: the page draws plots without them.
      - name: Build the wheel
        working-directory: packages/${{ matrix.project }}
        env:
          MATURIN_PEP517_ARGS: --no-default-features
        run: pyodide build -o dist

      # See `.cargo/config.toml`: pyodide-build's own rustflags are
      # target-specific, which is why that file names this target separately.
      # This is the step that notices if the remaps stop reaching it.
      - name: The wheel must carry no builder paths
        run: python3 scripts/check_binary_paths.py packages/"$PROJECT"/dist/*.whl

      - name: Cache nuclear-data test fixtures
        uses: actions/cache@v6
        with:
          path: ~/.cache/yamc
          key: yamc-test-fixtures-endf-b8.1-${{ hashFiles('crates/yamc-nuclide/src/storage/url_cache.rs', 'crates/nuclear-data-schema/src/lib.rs') }}
      - name: Fetch nuclear-data test fixtures
        run: python3 scripts/fetch_test_fixtures.py

      # `pyodide venv` makes a virtualenv whose `python` is Pyodide running in
      # Node, so this imports the wheel as the browser does. Node has no
      # synchronous XMLHttpRequest, so each smoke test installs a data fetcher
      # that serves the fixtures above as a published release (pointer,
      # manifest, files) and runs through the same release resolution,
      # verification and cache code the pages run: a Li-6 transport for
      # yamc-core, and for yani-core an iron irradiation read back as activity
      # and decay heat, with the transmutation chain served as the release's
      # subsections.
      - name: Smoke test the wheel inside Pyodide
        run: |
          set -euo pipefail
          case "$PROJECT" in
            yamc-core) smoke=scripts/pyodide_smoke_test.py ;;
            yani-core) smoke=scripts/pyodide_smoke_test_yani.py ;;
          esac
          pyodide venv .venv-pyodide
          .venv-pyodide/bin/pip install packages/"$PROJECT"/dist/*.whl
          .venv-pyodide/bin/python "$smoke" ~/.cache/yamc

      # `wheels-*`, so ci-python.yml's `collect` downloads it with the native
      # wheels and sorts it into its project's distributions by filename. No
      # GitHub release asset as well: PyPI carries the same file, and serves it
      # with the CORS headers a browser (micropip) needs, which release assets
      # do not.
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide-${{ matrix.project }}
          path: packages/${{ matrix.project }}/dist/*.whl
          if-no-files-found: error

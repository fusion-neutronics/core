name: Rust tests

on:
  push:
    branches: [ main ]
  # Every pull request, whatever its base, so a PR stacked on another
  # PR's branch is tested before it is retargeted at main.
  pull_request:
    # A change to prose alone cannot break a build or a test: no test, script or
    # include_str! reads a Markdown file. Pushes to main and releases are not
    # filtered.
    paths-ignore: ['**/*.md', 'docs/**', 'mkdocs.yml', 'LICENSE*']
  release:
    types: [published]
  workflow_dispatch:

# A newer push to a pull request makes its older run moot, so that run is
# cancelled. Only pull-request runs: a push to main, a release and a manual
# dispatch always finish, so nothing that builds or publishes is cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Three tries over ten seconds is all cargo gives a registry that is briefly
  # unreachable, and a release has already been lost to a twelve-second one
  # (yani-core 0.11.0). Ten stretches the same ladder over about a minute.
  CARGO_NET_RETRY: 10

jobs:
  build_and_test:
    name: Test on ${{ matrix.os }} / Rust
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The latest image of each OS. One macOS runner: macos-latest and
        # macos-14 are both Apple Silicon now (macos-26-arm64 and
        # macos-14-arm64), so running both repeated one architecture.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev cmake
      - name: Set up Rust
        run: rustup update stable && rustup default stable
      # Cache the dependency build. Without this every Rust job recompiled the
      # whole workspace -- arrow, faer, wgpu, cubecl -- from scratch on every
      # push, which is most of why these jobs ran as long as they did.
      #
      # Shared with the GPU-check and MPI jobs: same profile, and the bulk of
      # what they build is the same dependency set.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      # The `yamc-python` crate is a pyo3 binding built WITHOUT
      # `extension-module`, so `cargo test --workspace` links its test binary
      # against the full libpython and must find it at RUNTIME. Pin a Python
      # and put its lib dir on the loader path so the embed test no longer
      # depends on whatever interpreter the runner image happens to ship
      # (a runner-image change is what silently broke this job).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Expose libpython on the runtime loader path
        shell: bash
        run: |
          libdir="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          echo "python LIBDIR=$libdir"
          case "$RUNNER_OS" in
            Linux) echo "LD_LIBRARY_PATH=$libdir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV" ;;
            macOS) echo "DYLD_FALLBACK_LIBRARY_PATH=$libdir:${DYLD_FALLBACK_LIBRARY_PATH:-}" >> "$GITHUB_ENV" ;;
          esac
      - name: Lint
        run: cargo fmt --check --all
      - name: clippy
        # All targets except benches: the yamc-gpu benches reference the
        # `kernels` module, which is #[cfg(not(target_os = "macos"))], so
        # --all-targets would fail to compile them on macOS.
        run: cargo clippy --workspace --lib --bins --tests --examples -- -D warnings
      - name: Cache nuclear-data test fixtures
        uses: actions/cache@v6
        with:
          path: ~/.cache/yamc
          key: yamc-test-fixtures-endf-b8.1-${{ hashFiles('crates/yamc-nuclide/src/storage/url_cache.rs', 'crates/nuclear-data-schema/src/lib.rs') }}
      - name: Fetch nuclear-data test fixtures
        shell: bash
        run: python scripts/fetch_test_fixtures.py
      - name: Build
        run: cargo build --workspace --verbose
      - name: Build the converter on its own
        # A workspace build unifies features across crates, so a crate that
        # leaves out a feature it needs still builds there. The fixture fetch
        # step runs these binaries alone, which is where that fails.
        run: cargo build -p yamc-convert --bins
      - name: Test
        env:
          # The fetch step above ran, so the fixtures must now be readable at
          # the cache this build resolves. Without this the data-dependent tests
          # self-skip when they are not, and report green: that is how 35 files
          # spent months reading nothing on windows-latest, where
          # `$HOME` does not exist and every cache path resolved under a literal
          # `/home/jon`. crates/yamc/tests/fixture_cache_is_readable.rs is what
          # this switch arms.
          YAMC_REQUIRE_FIXTURES: "1"
        run: cargo test --workspace --verbose
      - name: Build Rust docs (public API)
        run: cargo doc --workspace --no-deps
      - name: Test yamc examples
        run: |
          cargo run -p yamc --example test_sampling
          cargo run -p yamc --example test_real_sampling
          cargo run -p yamc --example materials_demo
          cargo run -p yamc --example tbr
          cargo run -p yamc --example flux_example
      - name: Test yamt benchmark example
        run: cargo run -p yamt --example benchmark --release
      - name: Install cross-compilers (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Test cross-compilation (Linux only)
        if: runner.os == 'Linux'
        run: |
          # aarch64 is graviola-supported, so it gets the full default-feature
          # workspace check (the C-free HTTPS `download-tls` path).
          rustup target add aarch64-unknown-linux-gnu
          cargo check --workspace --target aarch64-unknown-linux-gnu
          # graviola supports x86_64 + aarch64 only. On other arches yamc uses the
          # crypto-free HTTP-only download path (or local data files), so verify
          # core + http-only build on representative HPC arches. These are pure
          # Rust (no cross C toolchain needed). 32-bit ARM is dropped: not a
          # target for this memory/compute-heavy workload.
          rustup target add powerpc64le-unknown-linux-gnu riscv64gc-unknown-linux-gnu
          for t in powerpc64le-unknown-linux-gnu riscv64gc-unknown-linux-gnu; do
            cargo check -p yamc --no-default-features --features arrow,download --target "$t"
          done

  # There is no `gpu_tests_compile` job any more. It existed because "the `gpu`
  # feature's integration tests are compiled by no other job", which stopped
  # being true when `gpu` joined yamc-python's default features: the workspace
  # build, clippy and test steps above now compile them, on four runners rather
  # than the one this job used. It type-checked only, because running them needs
  # a Vulkan adapter; the ones that need an adapter still self-skip, and the ~9
  # CPU twins that never needed one now actually run, which is what
  # `twin_temperature_parity.rs` always claimed happened.
  #
  # The `rustup update stable` it did for cubecl's higher rust-version is
  # already done by `build_and_test` above.

  # Code coverage (informational only -- never fails the build yet).
  # Self-contained: prints the % in the log and uploads the lcov + HTML report
  # as an artifact. No external service.
  #
  # Not on pull requests: it is a second, instrumented run of the whole Linux
  # Rust suite that build_and_test already runs, and it gates nothing. A push to
  # main (or a manual dispatch) still produces the report.
  coverage:
    name: Coverage (Linux, informational)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev cmake
      - name: Set up Rust
        run: rustup update stable && rustup default stable
      # Cache the dependency build. Without this every Rust job recompiled the
      # whole workspace -- arrow, faer, wgpu, cubecl -- from scratch on every
      # push, which is most of why these jobs ran as long as they did.
      #
      # Its OWN key, not the shared one: llvm-cov instrumentation changes
      # RUSTFLAGS, so every artifact differs and mixing them in would evict the
      # cache the other jobs rely on without ever hitting.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache nuclear-data test fixtures
        uses: actions/cache@v6
        with:
          path: ~/.cache/yamc
          key: yamc-test-fixtures-endf-b8.1-${{ hashFiles('crates/yamc-nuclide/src/storage/url_cache.rs', 'crates/nuclear-data-schema/src/lib.rs') }}
      - name: Fetch nuclear-data test fixtures
        run: python3 scripts/fetch_test_fixtures.py
      # Default features only (arrow). GPU device tests are adapter-gated and
      # skip without a Vulkan adapter; MPI is a separate feature. The number is
      # therefore "workspace, default features" -- not "all features".
      # TODO: optionally add a second run with --features mpi for fuller coverage.
      # --no-fail-fast: coverage is informational, so report the number even if
      # a test flakes (e.g. an adapter-dependent GPU test) rather than aborting.
      - name: Generate coverage (workspace, default features)
        run: |
          cargo llvm-cov --workspace --no-fail-fast --lcov --output-path coverage.lcov
          cargo llvm-cov --workspace --no-fail-fast --summary-only | tee coverage-summary.txt
      - name: Generate HTML report
        run: cargo llvm-cov report --html
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.lcov
            coverage-summary.txt
            target/llvm-cov/html

  # The data pins compiled into yamc-nuclide must name the stamps the live
  # origin serves. A pin the origin does not carry fails every download, fresh
  # installs included, so a pull request that bumps a pin goes red until the
  # data is uploaded, and main goes red if the origin moves without the pin.
  # The release gate in ci-python.yml runs the same test.
  data-pins:
    name: Data pins match the origin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: rustup update stable && rustup default stable
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - name: The origin serves every pinned data stamp
        run: >-
          cargo test -p yamc-nuclide --features download-tls --lib --
          --ignored origin_serves_every_pinned_data_version --nocapture

  # MPI is tested in ci-python.yml's test-mpi, which runs the Rust MPI tests
  # and the Rust tbr example as well as the Python ones. One job per OS builds
  # and links open-mpi once instead of twice, and that job gates releases.

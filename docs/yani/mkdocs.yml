# MkDocs configuration for the yani docs.
#
# The API reference is generated by mkdocstrings from the type stubs inside the
# installed `yani` wheel (built by ci-python.yml from packages/yani).
# `allow_inspection: false` is what makes that work, since the compiled
# extension carries no annotations and the committed `.pyi` files carry all of
# them.
#
# The exporter plugin renders every page in headless Chromium and joins them
# into one PDF, linked from the nav. Chromium rather than WeasyPrint because
# the maths is typeset by MathJax, which needs a browser to run.
#
# Build, from this directory: pip install yani -r docs/requirements.txt;
#   playwright install chromium; mkdocs build --strict
site_name: YANI
site_description: YANI -- Yet Another Nuclide Inventory -- transmutation and activation calculations
site_url: https://fusion-neutronics.github.io/yamc-and-yani/yani/
repo_url: https://github.com/fusion-neutronics/yamc-and-yani
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    # Styles the hover text on the column headings of the library tables.
    - content.tooltips
  palette:
    - scheme: default
      primary: white
      accent: indigo

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            # Read the typed .pyi stubs statically instead of inspecting the
            # compiled extension (which carries no annotations).
            allow_inspection: false
            docstring_style: google
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            show_submodules: false
            filters: ["!^_"]
            extensions:
              - docs/griffe_ext.py:PyO3Constructor
              - docs/griffe_ext.py:PublicApi
  - exporter:
      formats:
        pdf:
          enabled: true
          concurrency: 8
          stylesheets:
            - docs/pdf/pdf.css
          scripts:
            - docs/pdf/before-paging.js
          books:
            - output: yani-documentation.pdf
              covers: none

extra:
  generator: false

extra_css:
  - css/api.css
  - css/nav.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  # Maths. `generic: true` emits MathJax-agnostic markup that the loader in
  # docs/javascripts/mathjax.js renders; the Bateman equations on the overview
  # page are the reason this is here.
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - def_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables

nav:
  - Overview: index.md
  - Why YANI: why_yani.md
  - Getting started: getting_started.md
  - Nuclear data libraries: libraries.md
  - Usage: usage.md
  - Method: method.md
  - Validation: validation.md
  - API reference: api.md
  # Absolute, because the PDF is written by the exporter after the build and
  # is not a file in docs/ for MkDocs to resolve a relative link against.
  - Download as PDF: https://fusion-neutronics.github.io/yamc-and-yani/yani/yani-documentation.pdf

[package]
name = "nuclear-data-schema"
version = "0.1.0"
edition = "2021"
description = "The Arrow schema of the simulation-ready nuclear data format, declared once"
license = "MIT"

[lib]
name = "nuclear_data_schema"
path = "src/lib.rs"

# A leaf on purpose: the schema declarations and the JSON the reaction-range
# index rides in, and nothing else. yani depends on this and is the base of the
# standalone transmutation wheel (#381), so anything heavier here would leak
# into a package that must be installable without yamc. The neutral name says
# the same thing: this is not a yamc-* crate, because yani must be able to use
# it without depending on the transport engine.
[dependencies]
arrow-schema = "53"

# `reaction_ranges` parses and renders the index that rides in `version.json`.
serde_json = "1"

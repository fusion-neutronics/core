[package]
name = "yani-transmute"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Transmutation and activation driver over the yani solver -- irradiation schedules, multigroup spectrum collapse, per-material inventories"
license = "MIT OR Apache-2.0"

[lib]
name = "yani_transmute"
path = "src/lib.rs"

[dependencies]
# Nuclide-name parsing (`zam`), so self-shielding reads the mass number out
# of "Ta180_m1" the same way the rest of the workspace does rather than by
# hand. The crate is deliberately dependency-free, so this costs nothing.
endf = { path = "../endf" }
yani = { path = "../yani" }
# Activity and decay heat, so the ensemble accessors evaluate the same
# functions a user gets off a `Material` rather than a second copy of them.
# `yani-decay` depends on `yani` and `yamc-nuclide`, both already here, and
# never on this crate, so the edge is acyclic.
yani-decay = { path = "../yani-decay" }
# The counter-based PCG stream the transport side seeds from. A zero-dependency
# leaf, so the uncertainty sampler costs nothing to reach and gives the same
# answer on every platform.
yamc-rng = { path = "../yamc-rng" }
yamc-materials = { path = "../yamc-materials", default-features = false }
# The displacement threshold energies and the NRT conversion, shared with the
# transport side's damage-energy tally. Already reached through
# `yamc-materials`, so the edge adds nothing to the build.
yamc-element = { path = "../yamc-element", default-features = false }
yamc-nuclide = { path = "../yamc-nuclide", default-features = false }

# Split on target the way `yani/Cargo.toml` splits faer, and for the same
# reason: rayon has no thread pool on wasm32, where the browser has one thread
# and `yani-wasm` must keep building. Every parallel site here is written once
# and only its driver line is `#[cfg]`-ed, so the sequential and parallel forms
# cannot drift apart. No feature flag: this is a target-level concern, not a
# user-tunable knob.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"
# The dense symmetric eigensolver and matrix products behind every covariance
# factorization and nearest-correlation repair, split on target as `yani`
# splits it (and already in the build through it, so the edge adds nothing).
# Its parallelism runs at a fixed degree on a pool of its own (see
# `covariance_sample::dense_eigen`).
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
faer = { version = "0.24", default-features = false, features = ["std"] }

[features]
default = ["arrow"]
arrow = ["yamc-nuclide/arrow", "yamc-materials/arrow"]
download = ["yamc-nuclide/download", "yamc-materials/download"]
download-tls = ["download", "yamc-nuclide/download-tls", "yamc-materials/download-tls"]
# Debug tracing flag shared with the yamc crate, which forwards its own
# `debug_transmutation` here so a workspace-level build still gets the
# per-step inventory traces.
debug_transmutation = []

[dev-dependencies]
# The uncertainty test needs a directory that actually carries
# `covariance.arrow`, and nothing published does yet, so it writes one with the
# real converter from the committed ENDF fixture. No cycle: `yamc-convert` does
# not depend on this crate.
yamc-convert = { path = "../yamc-convert" }
lzma-rs = "0.3"
tempfile = "3"
# Explicit thread pools for the thread-count determinism test. A dev-dependency
# rather than a target-split one: dev-deps are not built for wasm32, so there is
# no wasm build to keep working here.
rayon = "1.10"
# Resolves the nuclear-data fixture cache the same way the loader does,
# rather than through `HOME` alone.
yamc-test-cache = { path = "../yamc-test-cache" }
# The MF=40 isomer-branching test writes its `branching_covariance.arrow` with
# the converter's own writer and reads it back as the chain loader holds it, so
# the blocks it draws are the file's, not a hand-built copy of its layout. No
# cycle: neither depends on this crate.
yani-convert = { path = "../yani-convert" }
arrow-ipc = "60"
# The branching-sources test reads its fixtures' curves straight from the
# files, apart from the loader it checks.
arrow-array = "60"

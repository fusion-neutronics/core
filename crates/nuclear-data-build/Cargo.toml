[package]
name = "nuclear-data-build"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Build a whole nuclear data library locally from its evaluated source archives"
license = "MIT OR Apache-2.0"

[lib]
name = "nuclear_data_build"
path = "src/lib.rs"

# Native only: nothing in a browser builds a library, and the download helper
# it uses (yamc-nuclide's `storage::fetch`) is not compiled for emscripten.
[dependencies]
endf = { path = "../endf" }
# For `storage::fetch::download_file`, the size- and sha256-checked download
# the published releases also stream through. Default features stay on: its
# download path does not compile without the arrow reader, and the gates that
# read each converted file back will need that reader anyway.
yamc-nuclide = { path = "../yamc-nuclide", features = ["download-tls"] }
# The home folder, for the OS Downloads folder (see src/os_downloads.rs).
etcetera = "0.11"
# Pure-Rust extraction of the source archives: .tar.gz and .tgz through
# flate2's default miniz_oxide backend, and .zip through flate2 as well.
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
# The converters each evaluation goes through, and the format version a
# finished folder must carry to be reused.
yamc-convert = { path = "../yamc-convert" }
nuclear-data-schema = { path = "../nuclear-data-schema" }
serde_json = "1.0"
# The memory that is free, which sizes the conversion pool, on every platform
# a library is built on.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# The Downloads known folder on Windows. The same crate and features etcetera
# already uses, so this adds nothing to the dependency tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
lzma-rust2 = "0.21"

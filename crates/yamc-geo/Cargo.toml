[package]
name = "yamc-geo"
version = "0.1.0"
edition = "2021"
description = "Geometry primitives for yamc (CSG surfaces, regions, bounding boxes) -- compiles to native and wasm32"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

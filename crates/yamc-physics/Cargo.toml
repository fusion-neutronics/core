[package]
name = "yamc-physics"
version = "0.1.0"
edition = "2021"
description = "Collision physics for yamc -- scatter/inelastic kinematics, secondary photon production, thick-target bremsstrahlung, D1S, particle banking"
license = "MIT"

[lib]
name = "yamc_physics"
path = "src/lib.rs"

[dependencies]
nalgebra = "0.34.1"
rand = "0.10"
smallvec = "1"
yani = { path = "../yani" }
yani-decay = { path = "../yani-decay" }
yamc-element = { path = "../yamc-element", default-features = false }
yamc-nuclide = { path = "../yamc-nuclide", default-features = false }
yamc-particle = { path = "../yamc-particle" }
yamc-rng = { path = "../yamc-rng" }

[features]
default = ["arrow"]
arrow = ["yamc-nuclide/arrow", "yamc-element/arrow"]
debug_diagnostics = []
debug_history = ["yamc-particle/debug_history"]

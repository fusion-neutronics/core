[package]
name = "yamc-convert"
version = "0.1.0"
edition = "2021"
description = "Convert ENDF and ACE evaluations into the transport Arrow format yamc reads"
license = "MIT"

[lib]
name = "yamc_convert"
path = "src/lib.rs"

# Same shape as yani-convert: the parser plus the schema, and nothing that
# reaches the transport engine itself.
[dependencies]
endf = { path = "../endf" }
nuclear-data-schema = { path = "../nuclear-data-schema" }
arrow-array = "53"
arrow-schema = "53"
arrow-ipc = { version = "53", features = ["lz4"] }
serde_json = "1.0"

[dev-dependencies]
# Resolves the nuclear-data fixture cache the same way the loader does,
# rather than through `HOME` alone (issue #544).
yamc-test-cache = { path = "../yamc-test-cache" }
lzma-rs = "0.3"
tempfile = "3"
# The reader is the only judge that matters: a conversion can satisfy every
# schema and still produce something yamc refuses to load.
yamc-nuclide = { path = "../yamc-nuclide", default-features = false, features = [
    "arrow",
    # The ranged-download test drives the real loader against a local origin.
    "download-tls",
] }

[pytest]
# Repo-wide pytest configuration.
#
# It lives in its own file rather than in a pyproject because there is no longer
# one project at the repo root: yamc-core and yani-core each have their own
# pyproject under packages/, and this config belongs to neither of them. A root
# pyproject carrying nothing but [tool.pytest.ini_options] would read like a
# third distribution that does not exist.
#
# Bare `pytest` discovers all three suites. CI still passes an explicit path,
# because each job installs only what its suite needs, and each suite has a job
# that installs exactly that:
#
#   packages/yamc-core/tests   needs the yamc wheel.        Run by `test`.
#   packages/yani-core/tests   needs the yani wheel, and NOTHING else, which is
#                              the point: it is what proves yani-core ships none
#                              of the transport stack.      Run by `yani-wheel`.
#   pytests/parity             needs BOTH wheels, which is why it is owned by
#                              neither package.             Run by `parity`.
#
# The last two had no job at all until #535. Naming a testpath is not running
# it, and `importorskip` reports the difference as a skip, so both suites read
# green while executing nothing.
#
# There was a fourth: the nuclear_data_to_arrow suite, which needed neither
# wheel and guarded the Arrow schema from the Python side. It went with the
# package. What it guarded is now guarded in Rust, against the declarations in
# `nuclear-data-schema` rather than against a rendered copy of them.
testpaths =
    packages/yamc-core/tests
    packages/yani-core/tests
    pytests/parity

# No `markers` block. There used to be four registered markers (slow,
# regression, mpi, gpu) whose stated purpose was to let the tiers be selected
# with `-m`, but nothing ever applied them: the only marks in the suite are
# skipif, parametrize and xfail. The tiers are selected by PATH instead
# (tests/regression_tests, tests/integration_tests, test_mpi*.py), which is what
# CI and .pre-commit-config.yaml actually do. Registering markers nobody uses
# only documented a capability the repo did not have.
#
# If `-m` selection is wanted later, it needs the marks applied to the tests
# first; adding the registrations back on their own would recreate the same gap.
